<!-- ============================================================================
     TONY BONY RIG (shared). Created by Scott Kahler, (c) 2026 S. Kahler Teaching.
     The one master copy of Tony for every SVG game. Games never paste a copy of it:
     they put an @include line for this file inside their own svg id="tonySvg"
     wrapper (viewBox "20 -50 160 302"), and tools/build.py drops it in.
     Ids all start with tb-. Joint pivots are in data-pivot (SVG units).
     Wardrobe pieces have class "tbw tbw-ITEM" and stay hidden until the root
     g#tb-tony has class "wear-ITEM". Use TonyRig.wear('ITEM') from tony.js.
     See shared/tony/README.md for adding a new costume piece.
     ============================================================================ -->
