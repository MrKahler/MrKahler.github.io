   ABOUT THE ROCK CYCLE (for the curious code reader)
   ---------------------------------------------------
   God made the rocks of the earth to change form, around and around, the same way water
   moves through the water cycle. There are three big families of rock:

   * IGNEOUS rock forms when melted rock (magma, or lava once it reaches the surface) cools
     and hardens. How fast it cools decides how it looks:
       - slowly, deep underground   -> big crystals you can see       (granite)
       - fast, on the surface       -> tiny crystals                  (basalt)
       - super fast, as in water    -> no crystals at all, just glass (obsidian)
       - fast and full of gas       -> trapped bubbles, it can float  (pumice)

   * SEDIMENTARY rock forms when wind, water, and ice break rock into pieces (sediment:
     gravel, sand, mud), and those pieces get packed down and glued together by minerals
     left behind by water. Sandstone, shale, conglomerate, and limestone (often made from
     seashells) are sedimentary rocks.

   * METAMORPHIC rock forms when heat and pressure deep underground change a rock into a new
     kind of rock without melting it. Granite becomes gneiss, shale becomes slate, sandstone
     becomes quartzite, limestone becomes marble. ("Metamorphic" means "changed form.")

   Any rock can travel to any other family: weathering breaks it down, squeezing builds it
   up, heat and pressure change it, and melting starts it over again. In this game each
   machine is one step of the cycle:

       Weather Blender  -> weathering and erosion   (rock -> sediment)
       Squish Press     -> compaction + cementing   (sediment -> sedimentary rock)
       Pressure Cooker  -> heat + pressure          (rock -> metamorphic rock)
       Lava Pot         -> melting + cooling        (rock -> magma -> igneous rock)
       Rock Scanner     -> a magnifier to discover the minerals inside each rock

   HOW THIS FILE IS BUILT
   ----------------------
   One self-contained HTML file: no internet, no installs, no server. Everything is inside:
   artwork is SVG and canvas drawing, sounds and music are synthesized live with WebAudio,
   and the GSAP animation library and the Fredoka/Nunito fonts are bundled in.
   Progress (found rocks, orders, discoveries) is saved in the browser's localStorage.

   Third-party pieces: GSAP 3.12.5 (GreenSock, free "Standard" no-charge license),
   Fredoka and Nunito fonts (SIL Open Font License 1.1).

.lv-body{position:relative;margin-top:10px}
.lv-track{position:absolute;left:22px;top:30px;bottom:30px;width:14px;border-radius:7px;background:#2d2452;box-shadow:inset 0 3px 0 rgba(0,0,0,.35)}
.lv-handle{position:absolute;left:3px;top:-2px;width:52px;height:52px;cursor:grab;touch-action:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb3a6,#ff5b52 40%,#b8202c);box-shadow:0 5px 0 rgba(0,0,0,.3);cursor:pointer;z-index:2}
.lv-notch{position:relative;height:84px;margin-left:62px;margin-bottom:6px;display:flex;align-items:center;gap:10px;border-radius:18px;padding:0 10px;cursor:pointer;background:#fff;box-shadow:0 3px 0 rgba(45,36,82,.12)}
.lv-notch svg{flex:none;width:42px;height:42px}
.lv-notch b{display:block;font:700 22px/1 var(--display)}
.lv-notch small{display:block;font:700 13px var(--body);color:var(--ink-soft);margin-top:3px}
.lv-notch.done{opacity:.55}
.lv-notch.cur{background:#dff7f2;box-shadow:0 0 0 4px #2ec4b6}
.lv-notch.next{background:#fff6c7;animation:nudge 1s ease-in-out infinite}
.lv-handle.ready{animation:knob 1s ease-in-out infinite;box-shadow:0 5px 0 rgba(0,0,0,.3),0 0 0 6px rgba(255,208,61,.75)}
.lv-handle.ready::after{content:"";position:absolute;left:50%;top:58px;margin-left:-9px;border:9px solid transparent;border-top:12px solid #ff6fa8}
@keyframes knob{50%{transform:translateY(8px)}}
.lv-handle.held{animation:none;cursor:grabbing}
.lv-notch.wait{opacity:.4;cursor:default}
@keyframes nudge{50%{transform:translateX(6px)}}
.lv-go{display:block;width:100%;margin-top:10px;height:60px;border:0;border-radius:999px;font:700 24px var(--display);background:#e8e2f4;color:#a79fc0;cursor:pointer;box-shadow:0 5px 0 rgba(45,36,82,.15)}
.lv-go.lit{background:radial-gradient(circle at 40% 30%,#ff9a8a,#ff4d4d 60%,#c4282f);color:#fff;box-shadow:0 6px 0 #8e1822;animation:nudge 1s ease-in-out infinite}
.lv-back{display:block;margin:10px auto 0;border:0;background:none;font:700 15px var(--display);color:var(--ink-soft);cursor:pointer;text-decoration:underline}

/* reveal */
#reveal{position:absolute;inset:0;display:none;z-index:9}
#reveal.on{display:block}
#reveal .back{position:absolute;inset:0;background:rgba(36,28,69,.72)}
#burst{position:absolute;left:250px;top:-220px;width:1100px;height:1100px}
#rvRock{position:absolute;left:640px;top:120px;width:320px;height:320px;transform-origin:50% 60%;filter:drop-shadow(0 14px 0 rgba(0,0,0,.25))}
#rvRibbon{position:absolute;left:400px;top:450px;width:800px;height:92px;display:flex;align-items:center;justify-content:center;font:700 52px var(--display);color:#fff;background:var(--pink);border-radius:20px;box-shadow:0 8px 0 #c94a80;text-shadow:0 3px 0 rgba(45,36,82,.25)}
#rvRibbon::before,#rvRibbon::after{content:"";position:absolute;top:22px;width:70px;height:72px;background:#e0518c;z-index:-1}
#rvRibbon::before{left:-48px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,30% 50%)}
#rvRibbon::after{right:-48px;clip-path:polygon(0 0,100% 0,70% 50%,100% 100%,0 100%)}
#rvCard{position:absolute;left:420px;top:566px;width:760px;background:#fff4e2;border-radius:24px;padding:16px 26px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
#rvCard .kid{margin:0;font:800 27px/1.3 var(--body)}
#rvCard .grown{margin:10px 0 0;font:700 17px/1.4 var(--body);color:var(--ink-soft)}
#rvCard .grown b{color:var(--grape)}
.rv-btn{position:absolute;left:640px;top:776px;width:320px;height:74px;border:0;border-radius:999px;background:var(--sun);font:700 28px var(--display);color:var(--ink);box-shadow:0 7px 0 #d39e00;cursor:pointer}
.rv-btn:active{transform:translateY(4px);box-shadow:0 3px 0 #d39e00}
@media (prefers-reduced-motion:reduce){.ticket.now,.zz{animation:none}}

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const R=(a,b)=>a+Math.random()*(b-a);

/* ==========================================================================================
   TEXTURES
   Draws each rock's surface on a canvas from its texture recipe: crystals, grains, layers, pebbles, shells, mud.
   No image files are used; every rock is painted by code.
   ========================================================================================== */
// Paint a rock's surface from its texture recipe (the heart of how every rock looks).
function drawTexture(ctx,S0,k){
  const t=ITEMS[k].tex,r=rng(hash(k)+7),Rr=(a,b)=>a+r()*(b-a);

  const poly=(cx,cy,rad,n,rot,fill,stroke)=>{ctx.beginPath();for(let i=0;i<n;i++){const a=rot+i/n*Math.PI*2,rr=rad*(.7+r()*.5),x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.2;ctx.stroke()}};
  const specks=(n,cols,a,b)=>{for(let i=0;i<n;i++){ctx.fillStyle=cols[i%cols.length];ctx.beginPath();ctx.arc(Rr(0,S0),Rr(0,S0),Rr(a,b),0,7);ctx.fill()}};
  const band=(top,bot,fill)=>{ctx.beginPath();for(let x=0;x<=S0;x+=6){const y=top(x);x?ctx.lineTo(x,y):ctx.moveTo(x,y)}for(let x=S0;x>=0;x-=6)ctx.lineTo(x,bot(x));ctx.closePath();ctx.fillStyle=fill;ctx.fill()};

      if(t.flakes)for(let i=0;i<t.flakes.n;i++){const s=t.flakes.s*Rr(.7,1.3);ctx.save();ctx.translate(Rr(0,S0),Rr(0,S0));ctx.rotate(Rr(0,6.3));ctx.fillStyle=t.flakes.c;ctx.beginPath();ctx.moveTo(-s,0);ctx.lineTo(-s*.5,-s*.45);ctx.lineTo(s*.5,-s*.45);ctx.lineTo(s,0);ctx.lineTo(s*.5,s*.45);ctx.lineTo(-s*.5,s*.45);ctx.closePath();ctx.fill();ctx.restore()}break}

    case 'glass':{const g=ctx.createRadialGradient(S0*.4,S0*.35,10,S0*.5,S0*.5,S0*.75);g.addColorStop(0,'#4a4258');g.addColorStop(1,'#0d0b12');fill(g);
      for(let i=0;i<16;i++){ctx.strokeStyle=`rgba(255,255,255,${Rr(.04,.15).toFixed(2)})`;ctx.lineWidth=Rr(1,3.5);ctx.beginPath();ctx.arc(S0*.95,S0*1.05,50+i*21,3.25,4.75);ctx.stroke()}
      ctx.save();ctx.translate(S0*.34,S0*.28);ctx.rotate(-.5);ctx.fillStyle='rgba(255,255,255,.14)';ctx.beginPath();ctx.ellipse(0,0,74,30,0,0,7);ctx.fill();ctx.restore();break}
    case 'grains':{fill(t.bg);for(let i=0;i<t.n;i++){const x=Rr(0,S0),y=Rr(0,S0),rr=Rr(t.min,t.max);ctx.fillStyle=pick(t.c);ctx.beginPath();ctx.ellipse(x,y,rr,rr*Rr(.75,1),Rr(0,3),0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(x-rr*.35,y-rr*.35,rr*.25,0,7);ctx.fill()}
      if(t.layers)for(let y=10;y<S0;y+=Rr(30,46)){const a=Rr(2,5),ph=Rr(0,6);band(x=>y+Math.sin(x/50+ph)*a,x=>y+12+Math.sin(x/50+ph)*a,'rgba(150,70,20,.16)')}break}
    case 'pebbles':{fill(t.bg);specks(3200,t.sand,.8,2);for(let i=0;i<t.n;i++){const x=Rr(0,S0),y=Rr(0,S0),rx=Rr(t.min,t.max),ry=rx*(t.flat?Rr(t.flat*.8,t.flat*1.2):Rr(.6,.9)),rot=t.flat?Rr(-.15,.15):Rr(0,3);ctx.fillStyle=pick(t.c);ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot,0,7);ctx.fill();ctx.strokeStyle='rgba(30,20,10,.22)';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='rgba(255,255,255,.25)';ctx.beginPath();ctx.ellipse(x-rx*.3,y-ry*.35,rx*.35,ry*.25,rot,0,7);ctx.fill()}break}
    case 'layers':{let y=-10,i=0;while(y<S0+10){const h=Rr(t.min,t.max),a=Rr(0,3),ph=Rr(0,6),per=Rr(30,70),y0=y;band(x=>y0+Math.sin(x/per+ph)*a,x=>y0+h+1+Math.sin(x/per+ph)*a,t.c[i%t.c.length]);y+=h;i++}specks(1600,['rgba(255,255,255,.12)','rgba(0,0,0,.14)'],.5,1.2);break}
    case 'shells':{fill(t.bg);specks(3200,t.c,.6,1.7);for(let i=0;i<t.n;i++){const s=Rr(12,28);ctx.save();ctx.translate(Rr(0,S0),Rr(0,S0));ctx.rotate(Rr(0,6.3));ctx.fillStyle=pick(t.sc);ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,s,Math.PI*1.08,Math.PI*1.92);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(80,60,40,.22)';ctx.lineWidth=1.3;ctx.beginPath();for(let a=1.15;a<1.9;a+=.13){ctx.moveTo(0,0);ctx.lineTo(Math.cos(a*Math.PI)*s,Math.sin(a*Math.PI)*s)}ctx.stroke();ctx.restore()}break}
    case 'mud':{fill(t.bg);specks(6500,t.c,.5,1.3);ctx.strokeStyle='rgba(50,34,22,.35)';ctx.lineWidth=2.6;ctx.lineCap='round';for(let i=0;i<9;i++){let x=Rr(0,S0),y=Rr(0,S0);ctx.beginPath();ctx.moveTo(x,y);for(let j=0;j<6;j++){x+=Rr(-28,28);y+=Rr(-28,28);ctx.lineTo(x,y)}ctx.stroke()}break}

}
const texCache={};
function tex(k){if(!texCache[k]){const c=document.createElement('canvas');c.width=c.height=300;drawTexture(c.getContext('2d'),300,k);texCache[k]=c}return texCache[k]}

/* ==========================================================================================
   ROCK SPRITES
   Turns a texture into a cute rock character: cuts the rock shape, adds shading, eyes, cheeks, and a mood
   (happy, wee, cold, sleep, locked). Results are cached as image URLs so they are only drawn once.
   ========================================================================================== */
const BLOBS=['M18,62 C10,40 28,18 52,16 C76,14 92,34 88,58 C85,80 64,88 46,86 C28,84 22,78 18,62Z','M12,60 C12,36 34,22 56,22 C80,22 92,42 88,64 C84,82 62,88 42,85 C22,82 12,74 12,60Z','M20,70 C10,52 22,24 46,20 C70,14 92,32 86,58 C83,76 70,86 50,86 C34,86 25,80 20,70Z','M16,58 C14,40 26,26 44,22 C58,18 70,26 80,30 C92,40 90,62 80,74 C70,86 46,88 32,82 C22,78 17,68 16,58Z'];
const PILE='M6,88 C14,60 32,42 50,42 C68,42 86,60 94,88 Z';
const shapeOf=k=>ITEMS[k].kind==='sediment'?PILE:BLOBS[hash(k)%BLOBS.length];
const faceY=k=>ITEMS[k].kind==='sediment'?68:52;
const spriteCache={};
// Build a rock character image: shape, texture, shading, and a face with the given mood.
function sprite(k,mood='happy',texK=k){
  const key=k+'|'+mood+'|'+texK;if(spriteCache[key])return spriteCache[key];
  const N=240,c=document.createElement('canvas');c.width=c.height=N;const ctx=c.getContext('2d');ctx.scale(N/100,N/100);
  const p=new Path2D(shapeOf(k));
  if(mood==='locked'){ctx.fillStyle='#d9ccb4';ctx.fill(p);ctx.fillStyle='#b4a68c';ctx.font='700 30px Fredoka, sans-serif';ctx.textAlign='center';ctx.fillText('?',50,faceY(k)+11);spriteCache[key]=c;return c}
  ctx.save();ctx.clip(p);ctx.fillStyle=ITEMS[texK].base;ctx.fillRect(0,0,100,100);
  ctx.drawImage(tex(texK),0,0,300,300,-8,-8,116,116);
  let g=ctx.createRadialGradient(34,30,4,40,40,60);g.addColorStop(0,'rgba(255,255,255,.42)');g.addColorStop(.6,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(0,0,100,100);
  g=ctx.createLinearGradient(0,50,0,92);g.addColorStop(0,'rgba(45,36,82,0)');g.addColorStop(1,'rgba(45,36,82,.32)');ctx.fillStyle=g;ctx.fillRect(0,0,100,100);
  ctx.restore();
  const fy=faceY(k),dark=ITEMS[texK].dark,ec=dark?'#fff8ec':'#2d2452',hi=dark?'#2d2452':'#fff';
  if(!dark){ctx.fillStyle='rgba(255,255,255,.55)';[40,60].forEach(x=>{ctx.beginPath();ctx.arc(x,fy,6.6,0,7);ctx.fill()})}
  ctx.strokeStyle=ec;ctx.fillStyle=ec;ctx.lineWidth=2.8;ctx.lineCap='round';
  if(mood==='sleep'){[40,60].forEach(x=>{ctx.beginPath();ctx.arc(x,fy,4,.2,Math.PI-.2);ctx.stroke()})}
  else if(mood==='cold'){ctx.beginPath();ctx.moveTo(35,fy-4);ctx.lineTo(42,fy);ctx.lineTo(35,fy+4);ctx.moveTo(65,fy-4);ctx.lineTo(58,fy);ctx.lineTo(65,fy+4);ctx.stroke()}
  else{const er=mood==='wee'?5.6:4.8;[40,60].forEach(x=>{ctx.beginPath();ctx.arc(x,fy,er,0,7);ctx.fill()});ctx.fillStyle=hi;[41.6,61.6].forEach(x=>{ctx.beginPath();ctx.arc(x,fy-1.6,1.5,0,7);ctx.fill()})}
  ctx.fillStyle='rgba(255,127,168,.6)';[30,70].forEach(x=>{ctx.beginPath();ctx.ellipse(x,fy+7,5,3,0,0,7);ctx.fill()});ctx.fillStyle=ec;
  if(mood==='wee'){ctx.beginPath();ctx.ellipse(50,fy+11,4.5,5.5,0,0,7);ctx.fill()}
  else if(mood==='cold'){ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(42,fy+11);for(let i=1;i<=6;i++)ctx.lineTo(42+i*2.7,fy+11+(i%2?-2.6:0));ctx.stroke();ctx.save();ctx.globalCompositeOperation='source-atop';ctx.fillStyle='rgba(150,200,255,.4)';ctx.fillRect(0,0,100,100);ctx.restore()}
  else{ctx.beginPath();ctx.moveTo(44,fy+8);ctx.quadraticCurveTo(50,fy+13,56,fy+8);ctx.stroke()}
  spriteCache[key]=c;return c;
}
const urlCache={};
function spriteURL(k,mood='happy'){const key=k+mood;if(!urlCache[key])urlCache[key]=sprite(k,mood).toDataURL();return urlCache[key]}

/* ==========================================================================================
   SOUND + MUSIC (SYNTHESIZED, NO FILES)
   Every sound effect and the background music are built from oscillators and noise with WebAudio,
   so the game needs no audio files. Ambient loops (wind, rain, river) play during weather stages.
   ========================================================================================== */
// The sound engine: synthesized effects, a looping tune with a step scheduler, and ambient weather loops.

    nbuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){ac=null}}

  const ok=()=>S.sound&&ac;

  function noise(dur,{type='bandpass',f=1000,f1=null,q=1,vol=.2,delay=0,attack=.01,curve=null,bus=null,at=null}={}){if(!ac)return;if(!bus&&!S.sound)return;const t=at!=null?at:ac.currentTime+delay,s=ac.createBufferSource();s.buffer=nbuf;s.loop=true;const fl=ac.createBiquadFilter();fl.type=type;fl.Q.value=q;fl.frequency.setValueAtTime(f,t);
    if(curve){curve.forEach(([ft,fv])=>fl.frequency.linearRampToValueAtTime(fv,t+ft*dur))}else if(f1)fl.frequency.exponentialRampToValueAtTime(f1,t+dur);
    const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.setValueAtTime(vol,t+Math.max(attack,dur*.7));g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(fl).connect(g).connect(bus||sfxBus);s.start(t,Math.random()*1.5);s.stop(t+dur+.05)}

             84,0,81,79,76,0,79,0, 81,0,76,0,72,74,76,0, 77,81,84,81,77,0,74,0, 79,0,0,74,72,0,0,0];

    click(){osc('square',1400,900,.04,.08)},

    thunder(){noise(1.6,{type:'lowpass',f:500,f1:80,vol:.55,attack:.01});osc('sine',70,35,1.2,.35)},
    crack(){noise(.15,{type:'highpass',f:1800,vol:.35,attack:.002});osc('square',300,80,.12,.1)},
    bling(){[1318.5,1975.5,2637,3520].forEach((f,i)=>{osc('sine',f,null,1.4,.14,i*.08,.003);osc('triangle',f*2,null,.5,.03,i*.08,.003)})},
    fanfare(){[523.3,659.3,784,1046.5].forEach((f,i)=>osc('triangle',f,null,i===3?.7:.22,.16,.12+i*.12))},
    stamp(){osc('sine',160,50,.22,.4);noise(.14,{type:'lowpass',f:1200,vol:.25,attack:.002})},

    blip(){osc('sine',R(620,1050),null,.05,.06)},

    amb(kind){if(!ok())return{stop(){}};const t=ac.currentTime,g=ac.createGain();g.gain.setValueAtTime(.0001,t);let src,lfo=null;

   A lightweight particle layer for confetti, stars, and puffs of steam or dust.
   ========================================================================================== */
const fx=$('fx'),fctx=fx.getContext('2d');let parts=[],fxOn=false;
function fxLoop(){fctx.clearRect(0,0,W,H);parts=parts.filter(p=>p.life>0);
  for(const p of parts){p.life-=1/60;p.vy+=p.g||0;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr||0;const a=clamp(p.life/p.max,0,1);fctx.save();fctx.globalAlpha=a;fctx.translate(p.x,p.y);fctx.rotate(p.rot||0);
    if(p.type==='conf'){fctx.fillStyle=p.c;fctx.fillRect(-7,-4,14,8)}
    else if(p.type==='puff'){fctx.fillStyle=p.c;fctx.beginPath();fctx.arc(0,0,p.r*(1.4-a*.4),0,7);fctx.fill()}
    else if(p.type==='star'){fctx.fillStyle=p.c;fctx.beginPath();for(let i=0;i<8;i++){const r=i%2?p.r*.4:p.r,an=i/8*Math.PI*2;fctx.lineTo(Math.cos(an)*r,Math.sin(an)*r)}fctx.fill()}
    fctx.restore()}
  if(parts.length)requestAnimationFrame(fxLoop);else{fxOn=false;fctx.clearRect(0,0,W,H)}}
function addParts(arr){parts.push(...arr);if(!fxOn){fxOn=true;requestAnimationFrame(fxLoop)}}
const CONF=['#ff6fa8','#ffd03d','#55bbff','#8b6cff','#2ec4b6','#ff7a3d'];

function puff(x,y,c='#fff',n=10){const a=[];for(let i=0;i<n;i++){const an=R(0,6.3),sp=R(1,4);a.push({type:'puff',x,y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-1,r:R(8,18),c,life:R(.4,.7),max:.7})}addParts(a)}

// Make machine k the big one: the old machine shrinks while the new one grows, all at the same time.
async function swapTo(k){

  const old=S.active,oe=$(MACH[old].id),ne=$(MACH[k].id),OL=LAY,NL=layoutFor(k),oM=MACH[old],nM=MACH[k];

    .to(oe,{x:MINI_W/2-oM.w/2,scaleX:oScale,scaleY:oScale,duration:D*.85,ease:'power2.inOut'},0)

    .fromTo(om,{scale:.85},{scale:1,duration:.4,ease:'back.out(3)',transformOrigin:'50% 100%'},D*.75)

    .to(ne,{y:-26,duration:D*.45,ease:'power2.out'},0)

    if(rk.m>=1){breakRock(sc,rk,x,y,sz);continue}
    c.save();c.translate(x,y);c.rotate(lift*T*7);
    const dis=sc.res==='limemud'?(.45+.55*rk.s):1;
    c.globalAlpha=(1-rk.m)*dis;c.drawImage(cur.f>.3?rk.A:rk.Aw,-sz/2,-sz*.52,sz,sz);
    c.globalAlpha=rk.m;c.drawImage(rk.B,-sz/2,-sz*.52,sz,sz);c.globalAlpha=1;
    const ca=(1-rk.m)*Math.max(.35,cur.f);
    if(rk.cp>0&&ca>.02){c.save();c.translate(-sz/2,-sz*.52);c.scale(sz/100,sz/100);c.clip(rk.path);c.lineJoin='round';c.lineCap='round';
      for(const pts of rk.cr){const L=Math.max(1,Math.round(rk.cp*(pts.length-1)));
        for(const [col,w] of [[`rgba(30,40,70,${.45*ca})`,2.4],[`rgba(225,245,255,${ca})`,1.1]]){c.strokeStyle=col;c.lineWidth=w;c.beginPath();for(let j=0;j<=L;j++){const [px,py]=pts[j];j?c.lineTo(px,py):c.moveTo(px,py)}c.stroke()}}
      c.restore()}
    c.restore();
  }
  /* pieces */
  for(const p of sc.parts){
    p.vy+=900*dt;p.vx*=Math.pow(.6,dt);p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=(p.vr+p.vx*.03)*dt;
    const lim=10+(p.y-10)*(40/240);if(p.x<lim+p.s){p.x=lim+p.s;p.vx=Math.abs(p.vx)*.5}if(p.x>CW-lim-p.s){p.x=CW-lim-p.s;p.vx=-Math.abs(p.vx)*.5}
    if(p.y>BOT-p.s*.6){p.y=BOT-p.s*.6;p.vy*=-.32;p.vx*=.8}
    const o=p.orb,th=o.a+T*o.sp,orx=cx(o.h)+Math.cos(th)*o.rad*(1-(o.h-50)/380),ory=o.h+Math.sin(th)*o.rad*.2;
    let x=p.x+(orx-p.x)*lift,y=p.y+(ory-p.y)*lift;x+=(p.tx-x)*settle;y+=(p.ty-y)*settle;p.dx=x;p.dy=y;
    const kc=p.k,s=p.s+(p.s1-p.s)*kc;
    c.save();c.translate(x,y);c.rotate(p.rot);
    if(kc<1){c.globalAlpha=1-kc;c.fillStyle=p.c0;c.beginPath();if(p.kind==='chunk'){c.moveTo(-s,-s*.4);c.lineTo(-s*.2,-s);c.lineTo(s*.9,-s*.5);c.lineTo(s,s*.5);c.lineTo(-s*.3,s*.9);c.closePath()}else c.ellipse(0,0,s,s*.8,0,0,7);c.fill();if(s>4){c.strokeStyle='rgba(30,20,10,.28)';c.lineWidth=1.1;c.stroke()}}
    if(kc>0){c.globalAlpha=kc;c.fillStyle=p.c1;c.beginPath();c.ellipse(0,0,s,s*.8,0,0,7);c.fill()}
    c.globalAlpha=1;
    if(s>5){c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.arc(-s*.3,-s*.3,s*.3,0,7);c.fill()}
    if(cur.f>.05&&s>2.5){c.fillStyle=`rgba(225,245,255,${.45*cur.f})`;c.beginPath();c.ellipse(0,0,s,s*.8,0,0,7);c.fill()}
    c.restore();
  }
  for(let i=sc.fxs.length-1;i>=0;i--){const f=sc.fxs[i];f.life-=dt;if(f.life<=0){sc.fxs.splice(i,1);continue}
    if(f.k==='splash'){c.strokeStyle=`rgba(200,235,255,${Math.min(1,f.life*4)})`;c.lineWidth=2;c.beginPath();c.arc(f.x,f.y,6+(.22-f.life)*40,Math.PI*1.1,Math.PI*1.9);c.stroke()}
    else if(f.k==='speck'){f.y-=14*dt;c.fillStyle=`rgba(255,255,255,${Math.min(.8,f.life)})`;c.beginPath();c.arc(f.x,f.y,1.6,0,7);c.fill()}
    else if(f.k==='spark'){c.fillStyle=`rgba(255,255,230,${Math.min(1,f.life*6)})`;c.beginPath();for(let j=0;j<8;j++){const r=j%2?3:9,an=j/8*Math.PI*2;c.lineTo(f.x+Math.cos(an)*r,f.y+Math.sin(an)*r)}c.fill()}
    else if(f.k==='flash'){c.fillStyle=`rgba(255,255,255,${Math.min(.55,f.life*3)})`;c.beginPath();c.arc(f.x,f.y,(f.big?24:14)*(1.2-f.life*3),0,7);c.fill()}}
  const fa=1-clamp((T-sc.flashT)/.08,0,1);if(T>=sc.flashT&&fa>0){c.fillStyle=`rgba(255,255,240,${fa*.5})`;c.fillRect(0,0,CW,CHh);c.strokeStyle=`rgba(255,247,160,${fa})`;c.lineWidth=6;c.beginPath();sc.bolt.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke()}
  c.restore();
  requestAnimationFrame(sceneFrame);
}

/* ==========================================================================================
   LEVER PANEL
   The step-by-step lever beside the zoomed blender. Students pull it one stage at a time the first time;
   after that, GO runs the whole recipe automatically.
   ========================================================================================== */
const leverEl=$('lever');
function renderLever(){
  const sc=SC;if(!sc){leverEl.classList.remove('on');return}
  leverEl.classList.add('on');
  const rows=[{k:'off',label:'Off',sub:'ready'}].concat(sc.recipe.map(k=>({k,label:STAGE[k].label,sub:STAGE[k].sub})));
  const pos=sc.stage+1,next=pos+1;
  let h=`<div class="lv-title">Weather Lever</div><div class="lv-sub">Pull it down one step at a time</div><div class="lv-body"><div class="lv-track"></div>`;
  rows.forEach((r,i)=>{const cls=i<pos?'done':i===pos?'cur':(i===next&&sc.ready&&!sc.pouring)?'next':'wait';
    h+=`<div class="lv-notch ${cls}" data-i="${i}">${IC[r.k]}<div><b>${r.label}</b><small>${r.sub}</small></div></div>`});
  const canGo=sc.ready&&!sc.pouring&&sc.stage<sc.recipe.length-1;
  h+=`<div class="lv-handle${canGo?' ready':''}" style="top:${pos*90+16}px" title="Drag me down!"></div></div>`;
  const autoOK=sc.stage<0&&S.recipes.has(sc.recipe.join('>'));
  h+=`<button class="lv-go${(sc.goReady&&!sc.pouring&&!sc.auto)||autoOK?' lit':''}">${autoOK?'GO! Auto-blend':sc.auto?'Auto-blending...':'GO! Pour it out'}</button>`;
  if(sc.stage<0)h+=`<button class="lv-back">Never mind</button>`;
  leverEl.innerHTML=h;
}
function leverNext(){
  const sc=SC;if(!sc||sc.pouring)return;
  if(!sc.ready){say('Not yet! Watch the weather do its work.');return}
  if(sc.stage>=sc.recipe.length-1){say('That\'s the last weather! Press the big red <b>GO</b> button to pour it out.');return}
  sceneStage(sc.stage+1);
}
leverEl.addEventListener('click',e=>{SFX.init();const sc=SC;if(!sc)return;
  if(e.target.closest('.lv-back')){sceneCancel();return}
  if(e.target.closest('.lv-go')){goPress();return}
  const n=e.target.closest('.lv-notch');if(!n)return;const i=+n.dataset.i,pos=sc.stage+1;
  if(i<=pos)return;
  if(i===pos+1)leverNext();else say('One step at a time! Pull the lever to the next notch.');
});

leverEl.addEventListener('pointerdown',e=>{
  const hd=e.target.closest('.lv-handle');if(!hd||!SC)return;e.preventDefault();SFX.init();
  const sc=SC,canGo=sc.ready&&!sc.pouring&&sc.stage<sc.recipe.length-1,y0=e.clientY;let dy=0;
  hd.classList.add('held');try{hd.setPointerCapture(e.pointerId)}catch(_){}

  const up=()=>{hd.removeEventListener('pointermove',mv);hd.removeEventListener('pointerup',up);hd.removeEventListener('pointercancel',up);hd.classList.remove('held');
    if(canGo&&(dy>38||dy<4)){gsap.to(hd,{y:90,duration:.12,onComplete:leverNext})}

  const xs=jarXs(srcs.length),outs=srcs.map((_,i)=>{const el=makeJarEl(res);gsap.set(el,{x:xs[i]-50,y:JAR_Y-90,scale:JAR_SC});return el});

    gsap.timeline({delay:i*.35,onStart:SFX.boing,onComplete(){el.remove();const rk={id:res,el:makeRockEl(res),x:landX,y:COUNTER_Y};gsap.set(rk.el,{x:landX-50,y:COUNTER_Y-90});addToCounter(rk);SFX.thud();const q=toStage(landX,COUNTER_Y-40);stars(q.x,q.y,10);r2()}})
      .to(el,{y:-40,rotation:-180,duration:.45,ease:'power2.out'})

/* ==========================================================================================
   BIG MACHINES: SQUISH PRESS, PRESSURE COOKER, LAVA POT
   The three rock-making machines. Each one accepts only rocks that fit its step of the rock cycle and
   always makes one family of rock: the press makes sedimentary, the cooker metamorphic, the lava pot igneous.
   ========================================================================================== */
const PRESS_MAP={sand:'sandstone',mud:'shale',limemud:'limestone',gravel:'conglomerate'};
const COOK_MAP={shale:'slate',granite:'gneiss',limestone:'marble',sandstone:'quartzite',conglomerate:'metaconglomerate'};
const BIGK=['press','cooker','lava'];
const BM={press:{item:null,n:0},cooker:{item:null,P:0,said:0},lava:{item:null,heat:0,magma:false}};
const SLOT={press:[100,84],cooker:[100,40],lava:[110,58]};
const mTop=k=>COUNTER_Y-MACH[k].h;
const PRESS_PUNS=['Talk about peer pressure!','Squeeze the day!','Now THAT is a tight squeeze.','No pain, no grain!'];
const COOK_PUNS=['She really cracked under pressure... in a good way!','Hot stuff!','What a total transformation!','Under pressure, rocks get a makeover!'];
const LAVA_PUNS=['He needs to chill. Oh wait, the rock just did!','That was a hot-headed move!','Cool, cool, cool.','Lava you, rock!'];
function overBig(r){const k=S.active;if(!BIGK.includes(k))return null;const L=LAY[k];return r.x>L.x-10&&r.x<L.x+L.w+10&&r.y>mTop(k)-100&&r.y<COUNTER_Y+20?k:null}
function bounceOff(r,msg){SFX.bleh();say(msg);const tx=boardSpot(0);gsap.killTweensOf(r.el);
  gsap.to(r.el,{keyframes:[{y:r.y-90-80,duration:.28,ease:'power2.out'},{y:COUNTER_Y-90,duration:.55,ease:'bounce.out'}]});
  gsap.to(r.el,{x:tx-50,rotation:240,scale:1,duration:.83,ease:'none',onComplete(){gsap.set(r.el,{rotation:0})}});
  r.x=tx;r.y=COUNTER_Y;addToCounter(r);gsap.delayedCall(.5,SFX.thud)}
// Pop a finished rock out of a machine and tumble it onto the counter.
function spawnFrom(k,id){const [sx,sy]=SLOT[k],px=LAY[k].x+sx+50,py=mTop(k)+sy+90,el=makeRockEl(id);gsap.set(el,{x:px-50,y:py-90});
  const tx=boardSpot(0),o={id,el,x:tx,y:COUNTER_Y};SFX.boing();
  gsap.to(el,{keyframes:[{y:py-90-110,duration:.32,ease:'power2.out'},{y:COUNTER_Y-90,duration:.6,ease:'bounce.out'}]});
  gsap.to(el,{x:tx-50,rotation:-300,duration:.92,ease:'none',onComplete(){gsap.set(el,{rotation:0})}});
  gsap.delayedCall(.75,SFX.thud);addToCounter(o);return o}
function flyInto(k,r,lx,ly,sc=1){const d=clamp(Math.hypot(r.x-50-LAY[k].x-lx,r.y-90-mTop(k)-ly)/700,.12,.45);return new Promise(res=>gsap.to(r.el,{x:LAY[k].x+lx,y:mTop(k)+ly,scale:sc,rotation:0,duration:d,ease:'power2.inOut',onComplete(){r.el.remove();res()}}))}
const kp=id=>ITEMS[id].kind==='sediment'?`that <b>${ITEMS[id].name.toLowerCase()}</b>`:`that <b>${ITEMS[id].kind}</b> rock`;
const NM=id=>`<b>${ITEMS[id].name.toUpperCase()}</b>`;
function produce(k,src,res,why,puns){gsap.delayedCall(.9,()=>afterBlend([src],res,puns,why))}
function ejectBig(k){const b=BM[k];if(!b.item)return;const id=b.item;b.item=null;
  if(k==='press'){gsap.set('#prRock',{opacity:0});prFace(0);b.n=0;gsap.to(PR,{ly:40,duration:.3,onUpdate:prSet})}
  if(k==='cooker'){gsap.set('#ckOld,#ckNew',{opacity:0});b.P=0;ckUpdate()}
  if(k==='lava'){gsap.set('#lvRock',{opacity:0});b.heat=0;lvLevel(1)}

// Load a rock into the press, cooker, or lava pot, or bounce it off with a hint if it does not belong there.
async function loadBig(k,r){
  const id=r.id,N=ITEMS[id].name;counter=counter.filter(c=>c!==r);
  if(S.busy){dropToCounter(r);return}
  if(k==='press'&&!PRESS_MAP[id]){bounceOff(r,ITEMS[id].kind==='sediment'?`Hmm, <b>${N}</b> won't squish into anything new.`:`<b>${N}</b> is already solid rock! The <b>Squish Press</b> squishes loose <b>sediment</b>: sand, mud, lime mud, or gravel.`);return}
  if(k==='cooker'&&!COOK_MAP[id]){bounceOff(r,ITEMS[id].kind==='sediment'?`<b>${N}</b> is too loose! Squish it into rock with the <b>Squish Press</b> first.`:ITEMS[id].kind==='metamorphic'?`<b>${N}</b> has already been cooked! She can't take any more pressure.`:`The Pressure Cooker doesn't know what to do with <b>${N}</b>! Try <b>granite</b>, <b>shale</b>, <b>limestone</b>, <b>sandstone</b>, or <b>conglomerate</b>.`);return}
  if(k==='lava'&&BM.lava.magma){bounceOff(r,'The Lava Pot is already full of <b>magma</b>! Pick how to cool it first.');gsap.delayedCall(2.4,lvAsk);return}
  if(BM[k].item)ejectBig(k);

  const nx=ORDERS[S.step].intro,PAGE={
    3:'ORDER UP! You are a <b>Weathering Wizard</b>! Wind, water, and ice break rock down into <b>sediment</b>.',
    6:'ORDER UP! You are a <b>Sedimentary Superstar</b>! Remember: the <b>Squish Press</b> always makes <b>sedimentary</b> rock.',
    10:'ORDER UP! You are a <b>Metamorphic Master</b>! Remember: the <b>Pressure Cooker</b> always makes <b>metamorphic</b> rock.',
    17:'ORDER UP! You are an <b>Ocean Rock Expert</b>!'};
  if(pageDone&&S.step===14)return{first:'You made <b>GRANITE</b> again! You went ALL the way around the <b>rock cycle</b>: granite, sediment, sedimentary rock, metamorphic rock, magma, and back to igneous granite!',
    queue:[{after:6500,html:'Here is a special gift: <b>LIMESTONE</b>! It is not made from granite at all. It is made from <b>seashells</b>! I put it on the counter for you.'},{after:6000,html:nx}]};
  if(pageDone&&PAGE[S.step])return{first:PAGE[S.step],queue:[{after:5200,html:(S.step===17?'Bonus orders unlocked! ':'')+nx}]};
  return{first:`Order up! ${i===0?'Great job!':'Nice work!'}`,queue:[{after:1800,html:nx}]};
}
// Limestone cannot come from granite (it forms from seashells), so Tony gives one as a gift after the full cycle.
function giveLimestone(){if(S.found.has('limestone')&&counter.some(c=>c.id==='limestone'))return;S.found.add('limestone');save();renderCabinet();renderTickets();
  const x=boardSpot(0),el=makeRockEl('limestone'),o={id:'limestone',el,x,y:COUNTER_Y};gsap.set(el,{x:x-50,y:-120});
  gsap.to(el,{y:COUNTER_Y-90,duration:1,ease:'bounce.out',onComplete(){const p=toStage(x,COUNTER_Y-40);stars(p.x,p.y,14);SFX.bling()}});addToCounter(o)}
// Stamp any open order on the current page that this rock fills; finishing a page unlocks the next lesson.
function checkOrder(res,quiet,mix=1){
  if(S.step>=ORDERS.length)return false;
  /* any open order on the current page counts, in any order */
  const [pa,pb]=PAGES[pageOf(S.step)];let i=-1,close=null;
  for(let n=pa;n<pb;n++){if(S.done.has(n))continue;const o=ORDERS[n];if(o.t!==res)continue;if(o.mix&&mix<o.mix){close=close||o;continue}i=n;break}
  if(i<0){if(!quiet){const o=ORDERS[S.step];sayT.push(setTimeout(()=>show(close?`So close! For this bonus, blend <b>${close.mix}</b> different kinds of rock together.`:o.intro),3600))}
    return false}
  const prev=S.step;S.done.add(i);while(S.step<ORDERS.length&&S.done.has(S.step))S.step++;save();
  const pageDone=S.step>=pb;
  const tk=$('tk'+i);if(tk){tk.classList.remove('now');tk.classList.add('done');gsap.fromTo(tk.querySelector('.stamp'),{scale:2.4,opacity:0},{scale:1,opacity:1,duration:.35,ease:'power3.in',onComplete:SFX.stamp})}
  gsap.delayedCall(1,()=>{SFX.fanfare();renderTickets()});
  if(pageDone)confetti(220);
  if(prev<14&&S.step>=14)gsap.delayedCall(quiet?9:6.5,giveLimestone);
  const msg=orderMsgs(i,pageDone);
  if(quiet)S.pendingMsg=msg;else say(msg.first,msg.queue);
  return true;
}

/* ==========================================================================================
   UI
   Sound and music toggles, restart, the credits line, and the full-collection celebration (the window plant blooms).
   ========================================================================================== */
function renderToggles(){$('sndTxt').textContent=S.sound?'Sounds on':'Sounds off';$('sndWaves').style.display=S.sound?'':'none';$('sndBtn').setAttribute('aria-pressed',S.sound);
  $('musTxt').textContent=S.music?'Music on':'Music off';$('musBtn').setAttribute('aria-pressed',S.music);$('musSlash').style.display=S.music?'none':''}
$('sndBtn').addEventListener('click',()=>{S.sound=!S.sound;save();renderToggles();SFX.init();SFX.pop()});
$('musBtn').addEventListener('click',()=>{S.music=!S.music;save();renderToggles();SFX.init();if(S.music)SFX.musicStart();else SFX.musicStop()});
$('resetBtn').addEventListener('click',()=>{SFX.init();if(S.busy)return;SFX.pop();
  say('Start over? All the rocks you made will turn back into mystery rocks.<div class="bub-btns"><button class="yes" data-act="reset">Yes, start over</button><button class="no" data-act="cancel">No, keep playing</button></div>')});
bubble.addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b)return;SFX.init();
  if(b.dataset.act==='cancel'){SFX.pop();say('Okay! Back to cooking.');return}
  if(b.dataset.act.startsWith('cool-')){SFX.pop();lvCool(b.dataset.act.slice(5));return}
  if(S.busy)return;doReset()});
// When every discovery is found, the window plant blooms.
function checkBloom(celebrate){const all=S.minerals.size>=TROPHIES.length,fs=document.querySelectorAll('#bloom .flower');
  if(!all){gsap.set(fs,{scale:0,transformOrigin:'50% 100%'});return false}
  if(!celebrate){gsap.set(fs,{scale:1});return true}
  fs.forEach((f,i)=>gsap.fromTo(f,{scale:0,rotation:-20},{scale:1,rotation:0,transformOrigin:'50% 100%',duration:.7,ease:'back.out(2.5)',delay:.6+i*.35,onStart:SFX.pop}));
  gsap.delayedCall(.5,()=>{confetti(200);SFX.fanfare()});return true}
$('credit').addEventListener('click',()=>{SFX.init();SFX.pop();say("<b>Tony Bony's Rock Kitchen</b> &copy; 2026 S. Kahler Teaching. Made for Mr. Kahler's science class!")});
// Restart: clear saved progress and start over with just granite.
function doReset(){
  try{localStorage.removeItem('rockKitchen02')}catch(e){}
  gsap.delayedCall(.1,()=>checkBloom(false));
  bigReset();S.found=new Set(START_FOUND);S.step=0;S.done=new Set();S.hello=false;S.cabSeen=false;S.pendingMsg=null;S.recipes=new Set();S.minerals=new Set();S.scanned=false;
  if(S.scanRock){S.scanRock=null;gsap.to(scEl,{opacity:0,scale:0,duration:.3})}scanReady();
  clearJar();lid(false);save();
  counter.forEach(poofAway);counter=[];renderCabinet();renderTickets();cabTo('closed');SFX.whoosh();renderTrophies();if(S.active!=='blender')swapTo('blender');
  say('All fresh! '+ORDERS[0].intro);
}
addEventListener('pointerdown',()=>SFX.init(),{once:true});

/* ==========================================================================================
   START
   Boot: build the kitchen, restore saved progress, and have Tony say hello.
   ========================================================================================== */
gsap.set('#scanner,#press,#cooker,#lava',{autoAlpha:0});bigInit();checkBloom(false);if(S.coat)TonyRig.wear('labcoat');renderCabinet();renderTickets();renderSleepers();renderTrophies();renderDrawers();renderToggles();face('open','smile');cabNudge();
say(S.step===0?'Hi! I\'m <b>Tony Bony</b>, head chef of the Rock Kitchen! I don\'t have any guts, but I\'ve got plenty of grit!':'Welcome back to the Rock Kitchen!',
  [{after:3800,html:S.step<ORDERS.length?ORDERS[S.step].intro:'Every order is done! Click me for a joke, or keep making rocks!'}].concat(S.scanned?[]:[{after:7000,html:'New! The <b>Rock Scanner</b> woke up. It\'s the blue one at the end of the counter. Click it to bring it over!'}]));
</script>
