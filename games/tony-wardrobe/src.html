<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tony's Wardrobe</title>
<!--
  Tony's Wardrobe: a test page for the shared Tony rig.
  Created by Scott Kahler, (c) 2026 S. Kahler Teaching.
  Every costume piece in shared/tony shows up here as a button automatically.
  Use it to check a new piece before putting it in a game.
-->
<style>
/* @fonts Fredoka:600,700 */
/* @include shared/tony/tony.css */
:root{--ink:#2d2452}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#ffe9c7;font-family:Fredoka,system-ui,sans-serif;color:var(--ink)}
main{display:flex;gap:40px;align-items:center;flex-wrap:wrap;justify-content:center;padding:24px}
#tonySvg{width:260px;height:490px}
h1{margin:0 0 6px;font-size:34px}
p{margin:0 0 18px;font-size:18px;max-width:340px}
.btns{display:flex;flex-direction:column;gap:10px}
button{border:0;border-radius:999px;padding:10px 22px;font:700 20px Fredoka,sans-serif;color:var(--ink);background:#fff;box-shadow:0 4px 0 rgba(45,36,82,.2);cursor:pointer;text-align:left}
button.on{background:#ff5d9e;color:#fff}
code{display:block;margin-top:16px;font-size:14px;background:#fff8;padding:8px 12px;border-radius:10px}
</style>
</head>
<body>
<main>
  <svg id="tonySvg" class="tb-idle" viewBox="20 -50 160 302" aria-label="Tony Bony" style="overflow:visible">
<!-- @include shared/tony/tony-rig.svg -->
  </svg>
  <div>
    <h1>Tony's Wardrobe</h1>
    <p>Tap a piece to put it on or take it off. Tap his hat to flip it.</p>
    <div class="btns" id="btns"></div>
    <code id="code"></code>
  </div>
</main>
<script>
/* @include shared/tony/tony.js */
</script>
<script>
const btns=document.getElementById('btns'),code=document.getElementById('code');
function render(){
  btns.innerHTML='';
  for(const k in TonyRig.items){const b=document.createElement('button');
    b.textContent=TonyRig.items[k].label;b.className=TonyRig.isWearing(k)?'on':'';
    b.onclick=()=>{TonyRig.toggle(k);render()};btns.appendChild(b)}
  code.textContent="TonyRig.setOutfit("+JSON.stringify(TonyRig.outfit()).replace(/"/g,"'")+")";
}
document.getElementById('tb-hatSlot').addEventListener('click',()=>TonyRig.flipHat());
render();
</script>
</body>
</html>
